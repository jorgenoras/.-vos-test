<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071423"><meta name="robots" content="noindex,nofollow">
  <title>Acesso privado · Ponte Voz</title>
  <link rel="icon" href="/assets/icon-180.png"><link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-body">
  <main class="login-box">
    <div class="brand-mark" aria-hidden="true">↔</div>
    <div class="eyebrow">ACESSO PESSOAL</div>
    <h1>Ponte Voz</h1>
    <p class="intro">Tradução entre português de Portugal e ucraniano. Acesso protegido por código.</p>
    <form method="post" action="/login" class="login-form">
      <label for="access_code">Código de acesso</label>
      <input id="access_code" name="access_code" type="password" autocomplete="current-password" placeholder="Introduz o teu código" required minlength="12" autofocus>
      <label class="remember"><input type="checkbox" name="remember" value="yes" checked> Manter sessão iniciada durante 30 dias neste dispositivo</label>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="button primary" type="submit">Entrar →</button>
    </form>
    <p class="tiny">O microfone só é ativado quando carregares em «Gravar voz» e aceitares a permissão.</p>
  </main>
</body>
</html>
